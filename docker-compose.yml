version: "3.8"

services:

  mongodb:
    image: mongo:7
    container_name: ai_chat_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ai_chat_net

  redis:
    image: redis:7
    container_name: ai_chat_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_chat_net

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    image: tunguyen005/ai-chat-ollama:latest   # ← thêm dòng này
    container_name: ai_chat_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - ai_chat_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tunguyen005/ai-chat-backend:latest  # ← thêm dòng này
    container_name: ai_chat_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ai_chat_db
      OLLAMA_URL: http://ollama:11434
      LLAMA_MODEL: llama3
      OLLAMA_VISION_MODEL: llava
      FRONTEND_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      MAX_FILE_SIZE: 10485760
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      ollama:
        condition: service_healthy
    networks:
      - ai_chat_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: tunguyen005/ai-chat-frontend:latest # ← thêm dòng này
    container_name: ai_chat_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ai_chat_net

volumes:
  mongo_data:
  redis_data:
  uploads_data:

networks:
  ai_chat_net:
    driver: bridge